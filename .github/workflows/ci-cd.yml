name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: CI - testes e Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: saude_fetal
          miniforge-version: latest
          python-version: '3.12'
      - name: Instalar dependências e executar testes
        shell: bash -el {0}
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install -e '.[dev,dagshub]'
          python -m pip check
          python -m pytest
      - name: Validar Compose e imagem de inferência
        env:
          DAGSHUB_USER_TOKEN: ci-placeholder
        run: |
          docker compose config --quiet
          docker build --pull --platform linux/amd64 --tag saude-fetal-inference:ci .
          docker run --rm --network none --entrypoint python saude-fetal-inference:ci \
            -c 'import dagshub, mlflow, xgboost'

  publish:
    name: Publicar imagem no GHCR
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar a origem da release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use uma tag de versão no formato v0.1.0.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Construir e verificar a imagem da release
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" .
          docker run --rm --network none --entrypoint python "$image" \
            -c 'import dagshub, mlflow, xgboost'
      - name: Publicar a imagem versionada
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
