# Oito combinações por família. A busca e cada estimador usam uma thread.
models:
  random_forest:
    estimator: random_forest
    params:
      n_estimators: 150
      n_jobs: 1
    grid:
      max_depth: [5, null]
      min_samples_leaf: [2, 8]
      class_weight: [null, balanced]

  xgboost:
    estimator: xgboost
    params:
      objective: "multi:softprob"
      eval_metric: mlogloss
      tree_method: hist
      n_jobs: 1
    grid:
      n_estimators: [100, 200]
      max_depth: [2, 4]
      learning_rate: [0.05, 0.15]
